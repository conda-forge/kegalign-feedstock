{% set name = "KegAlign" %}
{% set version = "0.2.1.12" %}
{% set kegalign_python_version = "3.12.*" %}
{% set kegalign_tbb_version = "2020.2.*" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # EXPERIMENT, NOT FOR MERGE. Building from a branch to isolate which part of
  # galaxyproject/KegAlign#39 broke the CUDA 12.9 build. That PR changed three things at once:
  # cmake_minimum_required 3.10 -> 3.30, the dialect 14 -> 17, and CUDA_STANDARD_REQUIRED ON.
  # This branch reverts ONLY the dialect. A green 12.9 job means the dialect was the cause.
  git_url: https://github.com/richard-burhans/KegAlign.git
  git_rev: exp-std14-keep-rest

build:
  number: 0
  skip: true  # [win or osx or cuda_compiler_version is undefined or cuda_compiler_version == "None"]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}
    - cmake
    - make
  host:
    {% if cuda_compiler_version is not undefined %}
    - cuda-version {{ cuda_compiler_version }}
    {% endif %}
    - libboost-devel
    - tbb-devel {{ kegalign_tbb_version }}
    - zlib
  run:
    - {{ pin_compatible("cuda-version", min_pin="x.x", max_pin="x") }}
    - bash
    - bashlex
    - coreutils
    - gawk
    - grep
    - gzip
    - nvidia-ml-py
    - python {{ kegalign_python_version }}
    - sed
    - tbb-devel {{ kegalign_tbb_version }}
    - time

test:
  commands:
    - kegalign --help

about:
  home: https://github.com/galaxyproject/KegAlign
  summary: 'KegAlign: A Scalable GPU-Based Whole Genome Aligner'
  description: |
    KegAlign is a Scalable GPU System for Pairwise Whole Genome
    Alignments based on LASTZ's seed-filter-extend paradigm.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://github.com/galaxyproject/KegAlign/blob/main/README.md
  dev_url: https://github.com/galaxyproject/KegAlign

extra:
  recipe-maintainers:
    - abgulhan
    - martenson
    - nekrut
    - richard-burhans
