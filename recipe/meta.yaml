{% set name = "KegAlign" %}
{% set version = "0.3.2" %}
{% set kegalign_python_version = "3.12.*" %}
{% set kegalign_tbb_version = "2020.2.*" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/galaxyproject/KegAlign/archive/refs/tags/v{{ version }}.tar.gz
  sha256: bdec97b68446164358aae2a29c53bb3847a8e5fbf4c55641532078bd3c932df0

build:
  number: 0
  skip: true  # [win or osx or cuda_compiler_version is undefined or cuda_compiler_version == "None"]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}
    - cmake
    - make
  host:
    - cuda-version {{ cuda_compiler_version }}  # [cuda_compiler_version is not undefined]
    - libboost-devel
    - tbb-devel {{ kegalign_tbb_version }}
    - zlib
  run:
    - {{ pin_compatible("cuda-version", min_pin="x.x", max_pin="x") }}
    - bash
    - bashlex
    - coreutils
    - gawk
    - grep
    - gzip
    - nvidia-ml-py
    - python {{ kegalign_python_version }}
    - sed
    - tbb-devel {{ kegalign_tbb_version }}
    - time

test:
  commands:
    - kegalign --help
    # The scripts are installed by an explicit list in build.sh, not a glob, so a script added
    # upstream ships only if someone remembers to add a line here too. Nothing else would notice:
    # the package builds, `kegalign --help` passes, and the omission surfaces only when a Galaxy
    # tool calls the missing file at run time. Assert each one is actually in the package.
    - test -x "$PREFIX/bin/build_pairs.py"
    - test -x "$PREFIX/bin/diagonal_partition.py"
    - test -f "$PREFIX/bin/lastz-cmd.ini"
    - test -x "$PREFIX/bin/package_output.py"
    - test -x "$PREFIX/bin/runner.py"
    - test -x "$PREFIX/bin/run_kegalign"
    - test -x "$PREFIX/bin/run_lastz_tarball.py"

about:
  home: https://github.com/galaxyproject/KegAlign
  summary: 'KegAlign: A Scalable GPU-Based Whole Genome Aligner'
  description: |
    KegAlign is a Scalable GPU System for Pairwise Whole Genome
    Alignments based on LASTZ's seed-filter-extend paradigm.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://github.com/galaxyproject/KegAlign/blob/main/README.md
  dev_url: https://github.com/galaxyproject/KegAlign

extra:
  recipe-maintainers:
    - abgulhan
    - martenson
    - nekrut
    - richard-burhans
